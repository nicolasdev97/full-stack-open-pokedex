name: Health Check

on:
  push:
    branches:
      - main

  # schedule:
  #   - cron: "0 12 * * *"

jobs:
  health_check:
    runs-on: ubuntu-22.04

    steps:
      - name: Check application health
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://full-stack-open-pokedex-wl0a.onrender.com/health
          max-attempts: 3
          retry-delay: 10s
